services:
  redis:
    image: redis:7-alpine

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mothra
      POSTGRES_PASSWORD: mothra
      POSTGRES_DB: mothra
    ports:
      - "127.0.0.1:5433:5432"   # host-only; 5433 avoids clashing with a host Postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mothra -d mothra"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  ic:
    build:
      context: ./ic
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: "8000"

  text-service:
    build:
      context: .
      dockerfile: text-service/Dockerfile
    ports:
      - "8002:8002"

  paco-classifier-service:
    build:
      context: .
      dockerfile: paco-classifier-service/Dockerfile
    ports:
      - "8003:8003"

  backend:
    build:
      context: ./landing-page
      additional_contexts:
        staff_finding: ./staff-finding
    ports:
      - "8001:8001"
    environment:
      # Defaults to the bundled postgres service; set DATABASE_URL in .env to use an external/managed DB.
      DATABASE_URL: ${DATABASE_URL:-postgresql://mothra:mothra@postgres:5432/mothra}
      MOTHRA_SECRET: ${MOTHRA_SECRET}
      CELERY_BROKER_URL: redis://redis:6379/0
      IC_API_URL: http://ic:8000
      IC_PUBLIC_URL: ${IC_PUBLIC_URL:-http://localhost:8000}
      TEXT_API_URL: http://text-service:8002
      PACO_API_URL: http://paco-classifier-service:8003
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    depends_on:
      redis:
        condition: service_started
      ic:
        condition: service_started
      text-service:
        condition: service_started
      paco-classifier-service:
        condition: service_started
      postgres:
        condition: service_healthy   # init_db()/_migrate_db() run at import; wait for DB
    volumes:
      - stored_models:/app/scripts/stored_models

  worker:
    build:
      context: ./landing-page
      additional_contexts:
        staff_finding: ./staff-finding
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://mothra:mothra@postgres:5432/mothra}
      MOTHRA_SECRET: ${MOTHRA_SECRET}
      CELERY_BROKER_URL: redis://redis:6379/0
      TEXT_API_URL: http://text-service:8002
      PACO_API_URL: http://paco-classifier-service:8003
    depends_on:
      redis:
        condition: service_started
      text-service:
        condition: service_started
      paco-classifier-service:
        condition: service_started
      postgres:
        condition: service_healthy
    command: celery -A celery_app.celery_app worker --loglevel=info --pool=threads --concurrency=2
    volumes:
      - stored_models:/app/scripts/stored_models

volumes:
  stored_models:
  pgdata: