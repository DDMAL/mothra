services:
  redis:
    image: redis:7-alpine

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mothra
      POSTGRES_PASSWORD: mothra
      POSTGRES_DB: mothra
    ports:
      - "127.0.0.1:5433:5432"   # host-only; 5433 avoids clashing with a host Postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mothra -d mothra"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  ic:
    build:
      context: ./ic
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      # IC's session store is process-local unless a DSN is set: without this,
      # `docker compose restart ic` silently drops in-flight classification
      # sessions (ic_api/store.py's build_default_store() reads
      # IC_DATABASE_URL, then DATABASE_URL, else in-memory). Same default as
      # backend/worker, so IC and mothra share one database; IC creates its own
      # `ic_sessions` table lazily on first use, so it needs no migrate gate --
      # only a reachable Postgres.
      DATABASE_URL: ${DATABASE_URL:-postgresql://mothra:mothra@postgres:5432/mothra}
    depends_on:
      postgres:
        condition: service_healthy

  text-service:
    build:
      context: .
      dockerfile: text-service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    healthcheck:
      # /healthz (mothra#220 row 29) -- see main.py's healthz() docstring.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  paco-classifier-service:
    build:
      context: .
      dockerfile: paco-classifier-service/Dockerfile
    # Internal-only: backend/worker reach it at http://paco-classifier-service:8003
    # over the Compose network. /classify has no authentication, so it must
    # never be published on the host -- `expose` documents the port without
    # binding it to 0.0.0.0 on the host machine.
    expose:
      - "8003"
    healthcheck:
      # /ready (not /health) so depends_on's service_healthy actually waits
      # for the classifier weights to have loaded as valid Keras models,
      # not just for the process to be serving HTTP -- see main.py's
      # ready()/health() docstrings.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-shot: init_db()/_migrate_db() no longer run as an import-time side
  # effect of auth_api.py (mothra#220 row 31) -- this runs the schema
  # migration once per `docker compose up`, before backend/worker start
  # (which now fail loudly on missing tables instead of silently creating
  # the schema themselves). Reuses the backend image; exits 0 on success,
  # so `service_completed_successfully` below is the actual gate.
  migrate:
    build:
      context: ./landing-page
      additional_contexts:
        staff_finding: ./staff-finding
        pitch_finding: ./pitch-finding
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://mothra:mothra@postgres:5432/mothra}
      MOTHRA_SECRET: ${MOTHRA_SECRET}
    command: python migrate.py
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./landing-page
      additional_contexts:
        staff_finding: ./staff-finding
        pitch_finding: ./pitch-finding
    ports:
      - "8001:8001"
    environment:
      # Defaults to the bundled postgres service; set DATABASE_URL in .env to use an external/managed DB.
      DATABASE_URL: ${DATABASE_URL:-postgresql://mothra:mothra@postgres:5432/mothra}
      MOTHRA_SECRET: ${MOTHRA_SECRET}
      CELERY_BROKER_URL: redis://redis:6379/0
      IC_API_URL: http://ic:8000
      IC_PUBLIC_URL: ${IC_PUBLIC_URL:-http://localhost:8000}
      TEXT_API_URL: http://text-service:8002
      PACO_API_URL: http://paco-classifier-service:8003
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    healthcheck:
      # /healthz (mothra#220 row 29) checks Postgres + Celery broker
      # reachability -- see main.py's healthz() docstring. Nothing in this
      # file currently depends_on backend's health (worker depends on
      # postgres/redis/text-service/paco directly instead), so this is for
      # `docker compose ps` visibility today, not a gate.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_started
      ic:
        condition: service_started
      text-service:
        condition: service_started
      paco-classifier-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - stored_models:/app/scripts/stored_models

  worker:
    build:
      context: ./landing-page
      additional_contexts:
        staff_finding: ./staff-finding
        pitch_finding: ./pitch-finding
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://mothra:mothra@postgres:5432/mothra}
      MOTHRA_SECRET: ${MOTHRA_SECRET}
      CELERY_BROKER_URL: redis://redis:6379/0
      TEXT_API_URL: http://text-service:8002
      PACO_API_URL: http://paco-classifier-service:8003
    depends_on:
      redis:
        condition: service_started
      text-service:
        condition: service_started
      paco-classifier-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A celery_app.celery_app worker -B --loglevel=info --pool=threads --concurrency=2
    volumes:
      - stored_models:/app/scripts/stored_models

volumes:
  stored_models:
  pgdata: