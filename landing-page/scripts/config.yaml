# Non-secret paths and service URLs. Env vars override these at runtime
# (see config.py) — set container hostnames via environment in
# docker-compose.yml rather than editing this file per environment.
# DATABASE_URL / MOTHRA_SECRET are secrets and stay out of this file —
# they come from .env / the process environment only.
paths:
  models_dir: stored_models
  medieval_models_dir: assets/models/medieval
  mei_encoding_dir: assets/mei_encoding
  # The pitch-finding/ submodule's flat module directory (algorithm #1;
  # see pitch_stage.py). Relative to this scripts/ dir, so it resolves to
  # <repo>/pitch-finding/scripts in a bare-metal checkout. Docker lands it
  # elsewhere and sets PITCH_FINDING_DIR instead -- that env var wins.
  pitch_finding_dir: ../../pitch-finding/scripts

services:
  ic_api_url: http://localhost:8000
  ic_public_url: http://localhost:8000
  text_api_url: http://localhost:8002
  paco_api_url: http://localhost:8003

celery:
  broker_url: redis://localhost:6379/0