apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: mothra
  labels:
    app: worker
spec:
  # mothra#220 row 31 removed worker's OTHER reason to stay at 1 replica
  # (init_db()/_migrate_db() no longer run at import). Still pinned to 1,
  # now for a different reason: row 28's embedded Celery beat (-B below) --
  # multiple worker replicas would each run their own beat scheduler and
  # double-fire the same periodic task. Revisit both together if scaling
  # worker is ever needed (e.g. a dedicated beat Deployment).
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      # --- GPU (MIG-backed vGPU) — mirrors Rodan k8s/33-gpu-celery.yaml ---
      # Pinned to mothra's own GPU node (Rodan owns k3s-gpu-node-2, so no MIG
      # contention). The NVIDIA runtime injects the MIG instance via
      # NVIDIA_VISIBLE_DEVICES=all (container env below). We deliberately do NOT
      # request nvidia.com/gpu: on this MIG guest the device plugin would then
      # overwrite NVIDIA_VISIBLE_DEVICES with the parent-GPU UUID → CUDA can't
      # open the MIG (CUDA_ERROR_NO_DEVICE). App auto-detects GPU→cuda, else cpu.
      runtimeClassName: nvidia
      nodeSelector:
        gpu: "true"
        kubernetes.io/hostname: k3s-gpu-node-1
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: worker
          image: ghcr.io/ddmal/mothra-backend:sha-6bf1c19
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - celery_app.celery_app
            - worker
            # -B: embedded beat scheduler, see celery_app.py's beat_schedule
            # (mothra#220 row 28). Safe only while worker is replicas=1 (row
            # 31); revisit if that ever changes, to avoid duplicate beat
            # schedulers double-firing periodic tasks.
            - -B
            - --loglevel=info
            - --pool=threads
            - --concurrency=2
          env:
            # MIG instance is injected by the NVIDIA runtime (not the device
            # plugin) — see the scheduling note above. compute,utility is
            # required or cuInit → CUDA_ERROR_NO_DEVICE.
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
          envFrom:
            - configMapRef:
                name: mothra-config
            - secretRef:
                name: mothra-secrets
          volumeMounts:
            - name: stored-models
              mountPath: /app/scripts/stored_models
          # Cold start on GPU (torch CUDA init + model load) is slow — gate
          # liveness behind a generous startupProbe (like Rodan's GPU worker).
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - "celery -A celery_app.celery_app inspect ping -d celery@$(hostname) --timeout 30"
            periodSeconds: 30
            timeoutSeconds: 35
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "celery -A celery_app.celery_app inspect ping -d celery@$(hostname) --timeout 30"
            periodSeconds: 60
            timeoutSeconds: 40
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: stored-models
          persistentVolumeClaim:
            claimName: mothra-stored-models
