apiVersion: apps/v1
kind: Deployment
metadata:
  name: ic
  namespace: mothra
  labels:
    app: ic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ic
  template:
    metadata:
      labels:
        app: ic
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: ic
          image: ghcr.io/ddmal/mothra-ic:sha-6bf1c19
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            # IC's session store is process-local unless a DSN is set: without
            # this, every ic rollout/restart silently drops in-flight
            # classification sessions (ic_api/store.py's build_default_store()
            # reads IC_DATABASE_URL, then DATABASE_URL, else in-memory).
            # Injected as a single key rather than `envFrom: secretRef` on the
            # whole Secret — IC has no use for MOTHRA_SECRET.
            # IC creates its own `ic_sessions` table lazily on first use, so
            # this needs no migrate Job of its own.
            - name: IC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mothra-secrets
                  key: DATABASE_URL
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ic
  namespace: mothra
  labels:
    app: ic
spec:
  selector:
    app: ic
  ports:
    - name: http
      port: 8000
      targetPort: 8000
