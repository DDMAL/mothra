apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mothra
  labels:
    app: backend
spec:
  # mothra#220 row 31: init_db()/_migrate_db() no longer run at import (see
  # k8s/migrate-job.yaml) -- backend no longer has a schema-migration reason
  # to stay at 1 replica. Left at 1 here as an operational decision, not a
  # code constraint; raise when actually needed.
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: ghcr.io/ddmal/mothra-backend:sha-6bf1c19
          imagePullPolicy: IfNotPresent
          # CMD from the image (uvicorn main:app --host 0.0.0.0 --port 8001)
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: mothra-config
            - secretRef:
                name: mothra-secrets
          volumeMounts:
            - name: stored-models
              mountPath: /app/scripts/stored_models
          # httpGet probes (mothra#220 row 29) replace bare tcpSocket ones, which
          # could only tell that the OS had a listener on the port, not that the
          # app was actually serving HTTP or that Postgres/the Celery broker
          # were reachable. readinessProbe checks dependencies (/healthz);
          # livenessProbe deliberately does NOT (/healthz/live) -- a transient
          # DB/broker outage should pull this pod out of rotation, not kill and
          # restart it. See main.py's healthz()/healthz_live() docstrings.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: stored-models
          persistentVolumeClaim:
            claimName: mothra-stored-models
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mothra
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8001
      targetPort: 8001
