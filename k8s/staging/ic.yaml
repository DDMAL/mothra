apiVersion: apps/v1
kind: Deployment
metadata:
  name: ic-staging
  namespace: mothra
  labels:
    app: ic-staging
    mothra.env: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ic-staging
  template:
    metadata:
      labels:
        app: ic-staging
        mothra.env: staging
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: ic
          # Placeholder tag — the deploy job rewrites it to this commit's
          # sha-<short>. sha-0000000 is intentionally not a real tag, so a missed
          # rewrite fails loudly (ImagePullBackOff) instead of silently shipping
          # whatever stale sha happened to be committed.
          image: ghcr.io/ddmal/mothra-ic:sha-0000000
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            # IC's session store is process-local unless a DSN is set: without
            # this, every ic rollout/restart silently drops in-flight
            # classification sessions (ic_api/store.py's build_default_store()
            # reads IC_DATABASE_URL, then DATABASE_URL, else in-memory).
            # Injected as a single key rather than `envFrom: secretRef` on the
            # whole Secret — IC has no use for MOTHRA_SECRET.
            # Staging shares the `mothra` namespace, so the unsuffixed
            # `mothra-secrets` resolves here too and would point staging IC
            # at the *production* database — the -staging suffix is the
            # invariant, same as backend.yaml's.
            # IC creates its own `ic_sessions` table lazily on first use, so
            # this needs no migrate Job of its own.
            - name: IC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mothra-secrets-staging
                  key: DATABASE_URL
          # startupProbe: ic imports its FastAPI app and builds its session
          # store before uvicorn binds this port, so nothing answers on 8000
          # at all until that finishes. Without this, livenessProbe's own
          # schedule below (20s initial delay + 3 failures 15s apart) kills
          # the container for "not up yet" at ~65s.
          #
          # Observed for real on 2026-09-28, deploying 0ebc8d3 to production:
          # that pod was SIGTERMed (exit 143) exactly 60s after start, with
          # "Liveness probe failed: dial tcp 10.42.0.171:8000: connect:
          # connection refused", and only came up on the retry -- where the
          # warm page cache got it listening in ~25s. The rollout survived on
          # that retry alone. This is the same failure text-service and
          # paco-classifier-service already guard against for the same
          # reason; ic was simply never given the same treatment. Staging is
          # the more exposed of the two environments here, not the less: it
          # redeploys far more often and lands on k3s-test, which is where
          # text-service's own startup budget was measured to be too small.
          #
          # A startupProbe suspends BOTH liveness and readiness until it
          # succeeds once, so a slow-but-eventually-fine boot is no longer
          # mistaken for a hang.
          #
          # httpGet /healthz, not the tcpSocket the two probes below use: it
          # proves the ASGI app is actually serving rather than just that
          # something bound the port, and it is safe to probe on a schedule
          # because it returns 200 even when the database is unreachable --
          # ic_api/main.py's healthz() keeps `status: "ok"` deliberately so
          # that a DB hiccup cannot become a restart loop, and reports the
          # store's reachability in the payload instead.
          #
          # failureThreshold * periodSeconds = 30 x 5s = 150s. That ceiling
          # is not arbitrary: it must stay UNDER CI's
          # `rollout status deploy/ic-staging --timeout=300s`
          # (build-images.yml), which is a shorter wait than the 900s the
          # other services get. Same ordering CLAUDE.md documents for
          # text-service and paco:
          #   startupProbe budget  <  CI rollout wait  <  progressDeadlineSeconds
          # here 150s < 300s < 600s (the Deployment default, unset below).
          # Raising this past 300s would hand the failure back to CI.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ic-staging
  namespace: mothra
  labels:
    app: ic-staging
    mothra.env: staging
spec:
  selector:
    app: ic-staging
  ports:
    - name: http
      port: 8000
      targetPort: 8000
