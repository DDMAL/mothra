apiVersion: apps/v1
kind: Deployment
metadata:
  name: paco-classifier-service
  namespace: mothra
  labels:
    app: paco-classifier-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paco-classifier-service
  template:
    metadata:
      labels:
        app: paco-classifier-service
    spec:
      securityContext:
        runAsNonRoot: true
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: paco-classifier-service
          image: ghcr.io/ddmal/mothra-paco-classifier-service:sha-0000000  # rewritten by CI's sed step on deploy
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8003
          # No env required (port fixed in the image CMD). TensorFlow
          # sliding-window inference over a full page makes this a
          # memory-heavy container — requests/limits below are a starting
          # point, not measured; tune after watching real usage (see
          # text-service's own OOM-kill lesson in CLAUDE.md).
          #
          # /health (liveness) confirms the process is actually serving
          # HTTP and that the weight files it validated at startup are
          # still present -- it does NOT exercise process_image_msae()
          # itself (which reloads its Keras models fresh on every
          # /classify call, so there's no persistent "warmed" state to
          # probe for on every poll). /ready (readiness) additionally
          # confirms those weight files actually loaded as valid Keras
          # models at startup, so a corrupt/incompatible .h5 (which passes
          # /health) keeps this pod out of rotation instead of silently
          # failing every /classify call -- see main.py's health()/ready()
          # docstrings.
          #
          # startupProbe: main.py loads TensorFlow and both Keras models
          # synchronously at MODULE IMPORT time, before uvicorn ever binds
          # this port -- so nothing answers /health or /ready at all until
          # that cold import finishes. Without this, livenessProbe's own
          # schedule (30s initial delay + 3 failures 15s apart) would kill
          # the container for "not up yet" at ~60s post-start, which a cold
          # TF import under this pod's 500m CPU request could plausibly
          # exceed -- restarting it before it ever finishes booting, over
          # and over. A startupProbe suspends both liveness and readiness
          # checks until it succeeds once, so a slow-but-eventually-fine
          # boot isn't mistaken for a hang. failureThreshold * periodSeconds
          # = 5 minutes of grace, generous for a cold TF+Keras import but
          # still bounded -- a genuinely hung container still gets killed.
          startupProbe:
            httpGet:
              path: /health
              port: 8003
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: paco-classifier-service
  namespace: mothra
  labels:
    app: paco-classifier-service
spec:
  selector:
    app: paco-classifier-service
  ports:
    - name: http
      port: 8003
      targetPort: 8003