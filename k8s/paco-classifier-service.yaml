apiVersion: apps/v1
kind: Deployment
metadata:
  name: paco-classifier-service
  namespace: mothra
  labels:
    app: paco-classifier-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paco-classifier-service
  template:
    metadata:
      labels:
        app: paco-classifier-service
    spec:
      securityContext:
        runAsNonRoot: true
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: paco-classifier-service
          image: ghcr.io/ddmal/mothra-paco-classifier-service:sha-0000000  # rewritten by CI's sed step on deploy
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8003
          # No env required (port fixed in the image CMD). TensorFlow
          # sliding-window inference over a full page makes this a
          # memory-heavy container — requests/limits below are a starting
          # point, not measured; tune after watching real usage (see
          # text-service's own OOM-kill lesson in CLAUDE.md).
          #
          # /health is a liveness/readiness signal only -- it does NOT
          # exercise process_image_msae() itself (which reloads its Keras
          # models fresh on every /classify call, so there's no persistent
          # "warmed" state to probe for). It confirms the process is
          # actually serving HTTP and that the weight files it validated at
          # startup are still present -- see main.py's health() docstring.
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: paco-classifier-service
  namespace: mothra
  labels:
    app: paco-classifier-service
spec:
  selector:
    app: paco-classifier-service
  ports:
    - name: http
      port: 8003
      targetPort: 8003