apiVersion: apps/v1
kind: Deployment
metadata:
  name: text-service
  namespace: mothra
  labels:
    app: text-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: text-service
  template:
    metadata:
      labels:
        app: text-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: text-service
          image: ghcr.io/ddmal/mothra-text-service:sha-6bf1c19
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          # DATABASE_URL (mothra#230, BATCH_DIR half): text-service now stores
          # batch-download zips in Postgres (text_batch_zips, db.py) instead of
          # node-local disk. The table itself is created by k8s/migrate-job.yaml
          # (which the deploy workflow always applies and waits on before this
          # Deployment), not by this process -- see text-service/db.py's module
          # docstring. Kraken/HTR + the baked-in Tridis OCR model make this a
          # memory-heavy container.
          envFrom:
            - secretRef:
                name: mothra-secrets
          # httpGet /healthz (mothra#220 row 29) replaces bare tcpSocket probes --
          # text-service has no broker of its own, and /healthz deliberately
          # doesn't ping the DB it now has (see main.py's healthz() docstring
          # for why), so there's still no dependency to distinguish readiness
          # from liveness on; both probes point at the same endpoint, unlike
          # backend.yaml's split.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: text-service
  namespace: mothra
  labels:
    app: text-service
spec:
  selector:
    app: text-service
  ports:
    - name: http
      port: 8002
      targetPort: 8002
