name: debug-k8s

# Throwaway, read-only diagnostic workflow. Piggybacks on the same
# `KUBECONFIG` repo secret build-images.yml's deploy job uses, so it needs no
# new credentials to inspect the live cluster. Manual trigger only -- never
# runs on push. Safe to leave in the repo (get/describe/logs are read-only),
# or delete once it's served its purpose.
#
# Usage: Actions tab -> "debug-k8s" -> "Run workflow", optionally overriding
# `label` (defaults to paco-classifier-service, the service this was
# originally written to debug -- see the deploy timeout writeup in git log /
# chat history around 2026-08-10).

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Namespace to inspect"
        required: false
        default: "mothra"
      label:
        description: "Value of the app= label selector to inspect"
        required: false
        default: "paco-classifier-service"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig from secret
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Pod status
        run: |
          set -x
          kubectl -n "${{ inputs.namespace }}" get pods -l "app=${{ inputs.label }}" -o wide
          kubectl -n "${{ inputs.namespace }}" get deploy "${{ inputs.label }}" -o wide

      - name: Pod describe (events, conditions, image pull status)
        run: |
          set -x
          kubectl -n "${{ inputs.namespace }}" describe pod -l "app=${{ inputs.label }}"

      - name: Namespace events (most recent last)
        run: |
          set -x
          kubectl -n "${{ inputs.namespace }}" get events --sort-by=.lastTimestamp | tail -60

      - name: Container logs (current)
        run: |
          set -x
          kubectl -n "${{ inputs.namespace }}" logs -l "app=${{ inputs.label }}" --all-containers --tail=300

      - name: Container logs (previous, if it crashed/restarted)
        continue-on-error: true
        run: |
          set -x
          kubectl -n "${{ inputs.namespace }}" logs -l "app=${{ inputs.label }}" --all-containers --tail=300 --previous

      - name: Node resource pressure (helps rule out unschedulable / OOM)
        run: |
          set -x
          kubectl top nodes || echo "metrics-server not available -- skipping"
          kubectl describe nodes | grep -A5 "Allocated resources"
