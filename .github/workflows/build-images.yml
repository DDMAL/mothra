name: ci-cd

# CI: builds the Mothra service images and pushes them to this repo's
# GitHub Container Registry (ghcr.io/<owner>/mothra-{backend,ic,text-service,paco-classifier-service}).
# CD: after a successful build, applies the app manifests and rolls out the
# deployments (all except redis and postgres).
# The Celery `worker` reuses the `mothra-backend` image, so it is not built here.
#
# Two environments share the `mothra` namespace and the same four images:
#   main            → production, manifests in k8s/
#   any other ref   → staging,    manifests in k8s/staging/
# Both manifest sets use identical *filenames*; the `resolve` job below picks the
# directory, and staging's object names carry a -staging suffix. See k8s/README.md.
#
# Only main deploys automatically (to production). Staging is deployed on demand
# from *any* branch: Actions → ci-cd → Run workflow → pick the branch → leave
# `environment: auto`. Auto-deploying staging on every push is deliberately not
# done — one shared staging environment and a ~25min four-image build don't
# survive ~20 active branches pushing into them.
# Note that a dispatched run uses the *selected branch's* copy of this workflow
# and of k8s/staging/, not main's — see the caveat in k8s/README.md.

on:
  push:
    branches:
      - main             # → production
  workflow_dispatch:
    inputs:
      environment:
        description: "Manifest set to deploy (auto = main→production, any other branch→staging)"
        type: choice
        default: auto
        options:
          - auto
          - staging
          - production

# Distinguishes the on-demand staging runs (now the common case) from main's
# automatic production deploys in the Actions run list.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('manual · {0} · {1}', inputs.environment, github.ref_name)
      || format('push · {0}', github.ref_name) }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold (cache-miss) backend build runs ~5-10 min. Anything past 45 is a
    # stuck runner or a hung registry pull, not a slow build -- release the
    # runner instead of letting it sit for the 6h default.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # backend: multi-stage Node(SPA + Neon submodule) -> Python/torch.
          # Needs the LFS-tracked medieval .pt weights baked in, plus the
          # sibling staff-finding/ dir (outside this context) via the
          # build-contexts input below, for staffline_stage.py's package.
          # Without that input BuildKit reads `COPY --from=staff_finding` in
          # landing-page/Dockerfile as an *image* reference and fails trying to
          # pull docker.io/library/staff_finding:latest.
          - name: backend
            context: ./landing-page
            file: ./landing-page/Dockerfile
            build-contexts: staff_finding=./staff-finding
          # ic: built from the ic submodule (has its own Dockerfile).
          - name: ic
            context: ./ic
            file: ./ic/Dockerfile
          # text-service: build context is the repo root so the sibling
          # mothra-text/ submodule is available to COPY.
          - name: text-service
            context: .
            file: ./text-service/Dockerfile
          # paco-classifier-service: build context is the repo root so the
          # sibling paco-classifier/ submodule is available to COPY.
          - name: paco-classifier-service
            context: .
            file: ./paco-classifier-service/Dockerfile

    steps:
      # Reclaim ~20-30GB on the runner: the CUDA-torch (backend/worker) and
      # kraken (text-service) images are large and can hit the ~14GB default
      # free space, failing the build with ENOSPC. Removes preinstalled
      # toolchains this build doesn't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force || true
          df -h /

      # submodules: neon (backend), mothra-text (text-service), ic (ic image),
      # paco-classifier (paco-classifier-service — code AND weights: its
      # models_v4/model_0.h5/model_1.h5 live inside the submodule itself, so
      # `submodules: recursive` alone is enough for those, no LFS needed here).
      # lfs: the medieval YOLO .pt weights, tracked in THIS repo's own
      # .gitattributes — without this they're checked out as pointer stubs
      # and inference fails at runtime.
      - name: Checkout (submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name (DDMAL -> ddmal).
          images: ghcr.io/${{ github.repository_owner }}/mothra-${{ matrix.name }}
          # `latest` is gated to the default branch: staging builds share these
          # image repos, so an ungated `latest` would be whichever environment
          # pushed most recently.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # Empty for every image except backend; the action treats an empty
          # value as "no additional contexts".
          build-contexts: ${{ matrix.build-contexts }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Single source of truth for the ref→environment mapping. A separate job (rather
  # than a step inside `deploy`) so the job-level `concurrency` block below can
  # read the resolved environment via `needs`.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.pick.outputs.env }}
      dir: ${{ steps.pick.outputs.dir }}
      suffix: ${{ steps.pick.outputs.suffix }}
    steps:
      - id: pick
        env:
          REF: ${{ github.ref_name }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'auto' }}
        run: |
          set -euo pipefail
          case "$REF" in
            main) ENV=production ;;
            *)    ENV=staging ;;
          esac
          if [ "$DISPATCH" != auto ]; then
            # Never let a feature branch's images reach production by dispatch.
            if [ "$DISPATCH" = production ] && [ "$REF" != main ]; then
              echo "::error::refusing to deploy production from '$REF' (main only)"
              exit 1
            fi
            ENV="$DISPATCH"
          fi
          # Both manifest sets use the same filenames: DIR selects the environment,
          # SUFFIX is the object-name suffix (used only by `rollout status`).
          if [ "$ENV" = production ]; then
            DIR=k8s;         SUFFIX=""
          else
            DIR=k8s/staging; SUFFIX="-staging"
          fi
          {
            echo "env=$ENV"
            echo "dir=$DIR"
            echo "suffix=$SUFFIX"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::deploying $ENV from $DIR (object suffix '${SUFFIX:-<none>}')"

  deploy:
    # Runs only after all four images are built & pushed, so the sha-tagged
    # images are guaranteed to exist before we roll the deployments.
    needs: [build, resolve]
    runs-on: ubuntu-latest
    # Bounds the job as a whole; the rollout loop below already caps itself at
    # 300s per deployment (5 deployments = 25 min worst case).
    timeout-minutes: 35
    # Serialize per *environment*, not per branch: two staging branches would
    # otherwise get separate groups and race on the same -staging objects, while
    # production and staging deploys share no objects and are safe in parallel.
    concurrency:
      group: deploy-${{ needs.resolve.outputs.env }}
      cancel-in-progress: false
    env:
      DIR: ${{ needs.resolve.outputs.dir }}
      SUFFIX: ${{ needs.resolve.outputs.suffix }}
    steps:
      - name: Checkout (manifests only)
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig from secret
        env:
          # Raw kubeconfig content stored in the KUBECONFIG repo secret.
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Pin image tag to this commit's sha
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA:0:7}"   # matches metadata-action type=sha,format=short
          echo "Deploying image tag: $TAG"
          FILES=("$DIR/backend.yaml" "$DIR/worker.yaml" "$DIR/ic.yaml" "$DIR/text-service.yaml" \
                 "$DIR/paco-classifier-service.yaml")
          sed -i -E "s#(ghcr\.io/ddmal/mothra-[a-z-]+):sha-[0-9a-f]{7}#\1:${TAG}#g" "${FILES[@]}"
          grep -H 'image: ghcr.io' "${FILES[@]}"
          # sed exits 0 when it matches nothing, so a drifted placeholder would
          # otherwise deploy whatever stale tag is committed. Fail loudly instead.
          # Matched on the full `image: <repo>:<tag>` shape rather than an
          # end-of-line ":$TAG", so a trailing comment after the tag can't fail an
          # otherwise-correct rewrite (the paco manifest used to carry one).
          for f in "${FILES[@]}"; do
            grep -qE "image: ghcr\.io/ddmal/mothra-[a-z-]+:${TAG}([[:space:]]|\$)" "$f" \
              || { echo "::error::image tag not pinned in $f"; exit 1; }
          done

      - name: Apply manifests (config, deployments, ingress; NOT redis/postgres/secrets)
        run: |
          set -euo pipefail
          kubectl apply \
            -f "$DIR/configmap.yaml" \
            -f "$DIR/backend.yaml" \
            -f "$DIR/worker.yaml" \
            -f "$DIR/ic.yaml" \
            -f "$DIR/text-service.yaml" \
            -f "$DIR/paco-classifier-service.yaml" \
            -f "$DIR/ingress.yaml"

      - name: Roll out deployments (all except redis & postgres)
        run: |
          set -euo pipefail
          # Object names, so SUFFIX applies here (not DIR).
          for d in backend worker ic text-service paco-classifier-service; do
            kubectl -n mothra rollout status "deploy/${d}${SUFFIX}" --timeout=300s
          done
          kubectl -n mothra get pods
