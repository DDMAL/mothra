name: ci-cd

# CI: builds the three Mothra service images and pushes them to this repo's
# GitHub Container Registry (ghcr.io/<owner>/mothra-{backend,ic,text-service}).
# CD: after a successful build, applies the app manifests and rolls out the
# deployments (all except redis and postgres).
# The Celery `worker` reuses the `mothra-backend` image, so it is not built here.

on:
  push:
    branches:
      - main
      - develop
      - k8s-deployment
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # backend: multi-stage Node(SPA + Neon submodule) -> Python/torch.
          # Needs the LFS-tracked medieval .pt weights baked in, plus the
          # sibling staff-finding/ dir (outside this context) via the
          # build-contexts input below, for staffline_stage.py's package.
          - name: backend
            context: ./landing-page
            file: ./landing-page/Dockerfile
            build-contexts: staff_finding=./staff-finding
          # ic: built from the ic submodule (has its own Dockerfile).
          - name: ic
            context: ./ic
            file: ./ic/Dockerfile
          # text-service: build context is the repo root so the sibling
          # mothra-text/ submodule is available to COPY.
          - name: text-service
            context: .
            file: ./text-service/Dockerfile

    steps:
      # Reclaim ~20-30GB on the runner: the CUDA-torch (backend/worker) and
      # kraken (text-service) images are large and can hit the ~14GB default
      # free space, failing the build with ENOSPC. Removes preinstalled
      # toolchains this build doesn't use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force || true
          df -h /

      # submodules: neon (backend), mothra-text (text-service), ic (ic image).
      # lfs: the medieval YOLO .pt weights the backend bakes in — without this
      # they are checked out as pointer stubs and inference fails at runtime.
      - name: Checkout (submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name (DDMAL -> ddmal).
          images: ghcr.io/${{ github.repository_owner }}/mothra-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ matrix.build-contexts }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    # Runs only after all three images are built & pushed, so the sha-tagged
    # images are guaranteed to exist before we roll the deployments.
    needs: build
    runs-on: ubuntu-latest
    # Serialize deploys per branch; don't cancel an in-flight rollout.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout (manifests only)
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig from secret
        env:
          # Raw kubeconfig content stored in the KUBECONFIG repo secret.
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Pin image tag to this commit's sha
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA:0:7}"   # matches metadata-action type=sha,format=short
          echo "Deploying image tag: $TAG"
          sed -i -E "s#(ghcr\.io/ddmal/mothra-[a-z-]+):sha-[0-9a-f]{7}#\1:${TAG}#g" \
            k8s/backend.yaml k8s/worker.yaml k8s/ic.yaml k8s/text-service.yaml
          grep -H 'image: ghcr.io' \
            k8s/backend.yaml k8s/worker.yaml k8s/ic.yaml k8s/text-service.yaml

      - name: Apply manifests (config, deployments, ingress; NOT redis/postgres/secrets)
        run: |
          set -euo pipefail
          kubectl apply \
            -f k8s/configmap.yaml \
            -f k8s/backend.yaml \
            -f k8s/worker.yaml \
            -f k8s/ic.yaml \
            -f k8s/text-service.yaml \
            -f k8s/ingress.yaml

      - name: Roll out deployments (all except redis & postgres)
        run: |
          set -euo pipefail
          for d in backend worker ic text-service; do
            kubectl -n mothra rollout status "deploy/$d" --timeout=300s
          done
          kubectl -n mothra get pods
