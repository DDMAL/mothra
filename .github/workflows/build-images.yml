name: build-images

# Builds the three Mothra service images and pushes them to this repo's
# GitHub Container Registry (ghcr.io/<owner>/mothra-{backend,ic,text-service}).
# The Celery `worker` reuses the `mothra-backend` image, so it is not built here.

on:
  push:
    branches:
      - main
      - k8s-deployment
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # backend: multi-stage Node(SPA + Neon submodule) -> Python/torch.
          # Needs the LFS-tracked medieval .pt weights baked in.
          - name: backend
            context: ./landing-page
            file: ./landing-page/Dockerfile
          # ic: built from the ic submodule (has its own Dockerfile).
          - name: ic
            context: ./ic
            file: ./ic/Dockerfile
          # text-service: build context is the repo root so the sibling
          # mothra-text/ submodule is available to COPY.
          - name: text-service
            context: .
            file: ./text-service/Dockerfile

    steps:
      # submodules: neon (backend), mothra-text (text-service), ic (ic image).
      # lfs: the medieval YOLO .pt weights the backend bakes in — without this
      # they are checked out as pointer stubs and inference fails at runtime.
      - name: Checkout (submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name (DDMAL -> ddmal).
          images: ghcr.io/${{ github.repository_owner }}/mothra-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}