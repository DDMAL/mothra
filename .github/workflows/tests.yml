name: tests

# Runs the staff-finding algorithmic test suite and the new landing-page
# staffline_adapter tests on every push, to any branch. A push-triggered
# check still attaches to that commit's SHA, so it shows up on any pull
# request built from those commits, same as a pull_request-triggered one
# would -- the difference is this also runs on plain pushes with no open PR.
# To actually make it block merging (not just report), add this job as a
# required status check under the repo's branch protection settings for
# main -- that is a separate, repo-settings-level step this workflow file
# cannot configure on its own.

on:
  push:
  workflow_dispatch:

# Only the newest push per branch needs testing. Superseded runs are cancelled
# rather than left to queue -- during the 2026-08-06 Actions incident, branches
# with rapid successive pushes had several redundant runs each competing for
# scarce hosted runners, which made the backlog worse for everyone.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The whole suite finishes in ~2 min. A job sitting far past that is stuck
    # on infrastructure, not working -- fail fast instead of holding a runner.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pillow: staffline_adapter.py's own import chain (encode_to_mei.py)
      # needs it beyond stdlib + the staff-finding package. PyYAML: pulled
      # in transitively by test_bbox_pipeline_integrity.py's medieval_models
      # import (medieval_models.py -> config.py, which loads config.yaml).
      - name: Install dependencies
        run: pip install -e "./staff-finding[diagnostics]" pytest Pillow PyYAML

      - name: staff-finding -- scripts/test_group_staves.py
        working-directory: staff-finding
        run: python -m pytest scripts/test_group_staves.py

      # test_run_page.py and test_run_pageOG.py each replace
      # sys.modules["torch"]/["ultralytics"]/["inference_simple"] with fake
      # stubs at module level, with no teardown. Collecting them in the same
      # pytest session as other script_tests files leaves those fakes in
      # place for whatever runs afterward -- confirmed to make
      # component_filter.filter_components() silently return empty results
      # for later tests (e.g. test_fit_centerline.py) that never touch
      # torch/ultralytics themselves. Running them in their own step
      # sidesteps this without needing to fix the underlying stubbing
      # approach in those two files.
      - name: staff-finding -- script_tests (excluding test_run_page/OG)
        working-directory: staff-finding
        run: >
          python -m pytest scripts/script_tests/
          --ignore=scripts/script_tests/test_run_page.py
          --ignore=scripts/script_tests/test_run_pageOG.py

      - name: staff-finding -- test_run_page.py (isolated, see note above)
        working-directory: staff-finding
        run: python -m pytest scripts/script_tests/test_run_page.py

      - name: staff-finding -- test_run_pageOG.py (isolated, see note above)
        working-directory: staff-finding
        run: python -m pytest scripts/script_tests/test_run_pageOG.py

      - name: landing-page -- DB-independent scripts tests
        run: python -m pytest landing-page/scripts/tests/

  # Type-checks the landing-page frontend on every branch push. Before this
  # job existed, nothing compiled TypeScript until `npm run build` ran inside
  # landing-page/Dockerfile -- which only happens in the ci-cd workflow, which
  # only runs on main. So a type error was invisible until *after* it had been
  # merged, and it surfaced as a failed deploy rather than a failed test. That
  # is exactly how `error TS6133: 'StafflinesTab' is declared but its value is
  # never read` broke the ci-cd builds for two consecutive merges to main on
  # 2026-08-04 (runs 30931964838 and 30940199845).
  #
  # This runs `tsc -b` only -- not the full `npm run build`. tsconfig.app.json
  # sets "noEmit": true and includes just `src`, so `tsc -b` is a pure
  # type-check that needs neither the neon submodule nor `build:neon`'s yarn
  # step. It catches the same errors in ~5s that the Docker build takes ~5min
  # to reach.
  #
  # `npm run lint` is deliberately NOT run here: eslint currently reports ~197
  # pre-existing errors across the codebase, so adding it would fail every run
  # until that backlog is cleared. Worth adding once it is green.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        working-directory: landing-page
        run: npm ci

      - name: Type-check (tsc -b)
        working-directory: landing-page
        run: npx tsc -b
